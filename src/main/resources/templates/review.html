<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Review</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Syllabus to Calendar</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<div class="container">
    <h1>Review extracted events</h1>
    <p class="sub">Term: <span th:text="${termLabel}"></span></p>
    <div class="card">
        <table>
            <tr>
                <th>Date</th>
                <th>Type</th>
                <th>Title</th>
            </tr>
            <tr th:each="e : ${events}">
                <td th:text="${e.date()}"></td>
                <td th:text="${e.type()}"></td>
                <td th:text="${e.title()}"></td>
            </tr>
        </table>
        <p th:if="${#lists.isEmpty(events)}">No events found.</p>
    </div>
    <div class="actions">
        <a class="btn-glass" href="/">Add</a>
    </div>
</div>
</body>
</html>
